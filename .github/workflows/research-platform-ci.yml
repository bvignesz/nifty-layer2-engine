name: Research platform offline regression
on:
  pull_request:
    paths:
      - "nifty_l2/**"
      - "eod_scanner/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/research-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research and testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research,test]"
      - name: Compile changed Python modules
        run: python -m compileall -q nifty_l2 eod_scanner tests
      - name: Full offline regression tests (includes frozen legacy checks)
        run: python -m pytest -q
